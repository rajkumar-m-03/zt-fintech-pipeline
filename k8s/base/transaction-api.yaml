apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-api
  namespace: fintech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-api
  template:
    metadata:
      labels:
        app: transaction-api
    spec:
      serviceAccountName: fintech-app
      containers:
        - name: transaction-api
          image: transaction-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 5001

          env:
            - name: LEDGER_URL
              value: "http://ledger-service:5002"
            - name: LEDGER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ledger-api-secret
                  key: api-token

          readinessProbe:
            httpGet:
              path: /readyz
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: 5001
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: transaction-api
  namespace: fintech
spec:
  selector:
    app: transaction-api
  ports:
    - port: 5001
      targetPort: 5001
  type: ClusterIP